<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RAGReactor · 智能社区</title>
  <style>
    :root{--ink:#18202d;--muted:#768093;--line:#e7e9ee;--panel:#fff;--bg:#f6f7f9;--brand:#ff3158;--soft:#fff0f3;--shadow:0 10px 35px rgba(23,31,45,.08)}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:15px/1.65 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button{font:inherit}.shell{width:min(720px,calc(100% - 28px));margin:0 auto;padding:22px 0 60px}.top{position:sticky;z-index:10;top:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 16px;margin-bottom:18px;border:1px solid rgba(231,233,238,.9);border-radius:18px;background:rgba(255,255,255,.92);box-shadow:var(--shadow);backdrop-filter:blur(16px)}.brand{font-size:19px;font-weight:800}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500}.nav{display:flex;align-items:center;gap:8px}.nav a,.mode{border:0;border-radius:10px;padding:7px 10px;color:var(--muted);background:#f2f3f6;text-decoration:none;cursor:pointer}.mode.active{color:#fff;background:var(--ink)}.feed{display:grid;gap:16px}.card{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 5px 22px rgba(23,31,45,.055)}.card.disliked{display:none}.head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px}.user{display:flex;align-items:center;gap:10px}.avatar{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;color:#fff;background:linear-gradient(145deg,#ff3158,#ff835c);font-weight:800}.name{font-weight:750}.time,.reason{color:var(--muted);font-size:12px}.body{padding:0 18px 15px;white-space:pre-wrap;overflow-wrap:anywhere}.media{display:block;width:100%;max-height:620px;object-fit:contain;background:#101115}.file{display:block;margin:0 18px 16px;padding:12px;border-radius:10px;background:#f4f5f7;color:var(--ink)}.actions{display:flex;align-items:center;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}.action{border:0;border-radius:11px;padding:8px 12px;color:#4c5566;background:#f5f6f8;cursor:pointer}.action.on{color:var(--brand);background:var(--soft)}.action.dislike{margin-left:auto}.load{width:100%;margin-top:16px;border:1px solid var(--line);border-radius:13px;padding:11px;color:var(--ink);background:#fff;cursor:pointer}.load:disabled{opacity:.55}.state{padding:50px 20px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #d9dce3;border-radius:18px}.error{color:#a31d38;background:#fff0f3;border-color:#ffcbd5}.fallback{margin-top:18px;text-align:center;color:var(--muted);font-size:12px}.fallback a{color:inherit}@media(max-width:560px){.shell{width:min(100% - 18px,720px);padding-top:9px}.top{border-radius:14px}.brand small{display:none}.nav a{display:none}.head,.body{padding-left:14px;padding-right:14px}.actions{overflow:auto}.action{white-space:nowrap}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand">智能社区<small>发现知识，也分享经验</small></div>
      <nav class="nav">
        <button class="mode active" data-mode="for_you">为你推荐</button>
        <button class="mode" data-mode="latest">最新</button>
        <a href="/upload.html">发布</a><a href="/welcome.html">首页</a>
      </nav>
    </header>
    <section id="feed" class="feed" aria-live="polite"><div class="state">正在加载社区内容…</div></section>
    <button id="loadMore" class="load" hidden>加载更多</button>
    <div class="fallback">推荐流不可用？<a href="/community-legacy.html">打开传统时间流</a></div>
  </main>
  <script>
    const feed=document.getElementById('feed'),loadMore=document.getElementById('loadMore');
    let cursor=null,loading=false,mode='for_you',hasLoaded=false;
    const visible=new Map(),seenImpressions=new Set();
    function cookie(name){for(const part of document.cookie.split(';')){const item=part.trim();if(item.startsWith(name+'='))return decodeURIComponent(item.slice(name.length+1))}return''}
    function eventId(){return crypto.randomUUID?.()||`${Date.now()}-${Math.random().toString(16).slice(2)}-event`}
    function showError(message){feed.innerHTML='';const box=document.createElement('div');box.className='state error';box.textContent=message;feed.append(box)}
    async function action(postId,type,extra={}){try{const response=await fetch('/api/community/action',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':cookie('csrf_token')},body:JSON.stringify({event_id:eventId(),post_id:String(postId),action:type,...extra}),keepalive:true});if(response.status===401)location.href='/log.html'}catch(error){console.warn('community action failed',error)}}
    function renderMedia(content){if(!content.media_url)return null;if(content.media_type==='image'){const image=document.createElement('img');image.className='media';image.src=content.media_url;image.loading='lazy';image.alt='帖子图片';return image}if(content.media_type==='video'){const video=document.createElement('video');video.className='media';video.src=content.media_url;video.controls=true;video.preload='metadata';return video}const link=document.createElement('a');link.className='file';link.href=content.media_url;link.textContent='查看附件';return link}
    function button(label,state,type,postId,requestId){const value=document.createElement('button');value.className='action'+(state?' on':'');value.textContent=label;value.dataset.on=state?'1':'0';value.addEventListener('click',()=>{const on=value.dataset.on==='1',next=!on;value.dataset.on=next?'1':'0';value.classList.toggle('on',next);action(postId,next?type:`un${type}`,{recommendation_request_id:requestId})});return value}
    function card(item,requestId){const article=document.createElement('article');article.className='card';article.dataset.postId=item.post_id;article.dataset.position=item.recommendation.position;article.dataset.requestId=requestId;const head=document.createElement('div');head.className='head';const user=document.createElement('div');user.className='user';const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=(item.author.username||'?').slice(0,1).toUpperCase();const who=document.createElement('div');const name=document.createElement('div');name.className='name';name.textContent=item.author.username;const time=document.createElement('div');time.className='time';time.textContent=new Date(item.created_at).toLocaleString();who.append(name,time);user.append(avatar,who);const reason=document.createElement('div');reason.className='reason';reason.textContent=item.recommendation.reason;head.append(user,reason);article.append(head);if(item.content.text){const body=document.createElement('div');body.className='body';body.textContent=item.content.text;article.append(body)}const media=renderMedia(item.content);if(media)article.append(media);const controls=document.createElement('div');controls.className='actions';const like=button(`赞 ${item.stats.likes}`,item.viewer_state.liked,'like',item.post_id,requestId);const collect=button(`收藏 ${item.stats.collects}`,item.viewer_state.collected,'collect',item.post_id,requestId);const ask=document.createElement('button');ask.className='action';ask.textContent='基于此提问';ask.addEventListener('click',()=>{sessionStorage.setItem('rag_community_question',`请结合这篇社区帖子回答：${(item.content.text||'').slice(0,2000)}`);location.href='/rag.html#community'});const related=document.createElement('button');related.className='action';related.textContent='相关内容';related.addEventListener('click',async()=>{related.disabled=true;try{const response=await fetch(`/api/community/related?post_id=${item.post_id}`),data=await response.json();if(!response.ok)throw new Error();alert(`相关知识：${data.related_knowledge?.[0]?.text||'暂无'}\n\n相关帖子：${data.related_posts?.[0]?.text||'暂无'}`)}finally{related.disabled=false}});const dislike=document.createElement('button');dislike.className='action dislike';dislike.textContent='不感兴趣';dislike.addEventListener('click',()=>{action(item.post_id,'dislike',{position:item.recommendation.position,recommendation_request_id:requestId});article.classList.add('disliked');observer.unobserve(article)});controls.append(like,collect,ask,related,dislike);article.append(controls);observer.observe(article);return article}
    const observer=new IntersectionObserver(entries=>{const now=performance.now();for(const entry of entries){const id=entry.target.dataset.postId,position=Number(entry.target.dataset.position),recommendation_request_id=entry.target.dataset.requestId;if(entry.isIntersecting&&entry.intersectionRatio>=.5){if(!visible.has(id))visible.set(id,now);if(!seenImpressions.has(id)){seenImpressions.add(id);action(id,'impression',{position,recommendation_request_id})}}else if(visible.has(id)){const duration=Math.round(now-visible.get(id));visible.delete(id);if(duration>=1000)action(id,'dwell',{duration_ms:Math.min(duration,1800000),position,recommendation_request_id});else action(id,'skip',{position,recommendation_request_id})}}},{threshold:[0,.5]});
    async function load(reset=false){if(loading)return;loading=true;loadMore.disabled=true;if(reset){cursor=null;hasLoaded=false;seenImpressions.clear();visible.clear();document.querySelectorAll('.card').forEach(card=>observer.unobserve(card));feed.innerHTML='<div class="state">正在加载社区内容…</div>'}try{const params=new URLSearchParams({limit:'10',mode});if(cursor)params.set('cursor',cursor);const response=await fetch(`/api/community/feed?${params}`);if(response.status===401){location.href='/log.html';return}const data=await response.json();if(!response.ok)throw new Error(data.error?.message||`HTTP ${response.status}`);if(!hasLoaded)feed.innerHTML='';data.items.forEach(item=>feed.append(card(item,data.request_id)));hasLoaded=true;cursor=data.next_cursor;if(!feed.children.length)feed.innerHTML='<div class="state">社区还没有内容，发布第一条帖子吧。</div>';loadMore.hidden=!cursor}catch(error){showError(`加载失败：${error.message}`);loadMore.hidden=true}finally{loading=false;loadMore.disabled=false}}
    loadMore.addEventListener('click',()=>load());document.querySelectorAll('.mode').forEach(value=>value.addEventListener('click',()=>{if(value.classList.contains('active'))return;document.querySelectorAll('.mode').forEach(item=>item.classList.remove('active'));value.classList.add('active');mode=value.dataset.mode;load(true)}));
    load();
  </script>
</body>
</html>
