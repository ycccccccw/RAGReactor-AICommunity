<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RAGReactor · 本地知识库</title>
  <style>
    :root{color-scheme:light;--ink:#172033;--muted:#697386;--line:#dce2ea;--panel:#fff;--bg:#f4f7fb;--brand:#3157d5;--brand2:#183997;--ok:#178557;--bad:#bd2c38;--shadow:0 18px 55px rgba(30,45,80,.10)}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 15% 0,#e4eaff 0,transparent 34%),var(--bg);font:15px/1.65 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
    .shell{width:min(1120px,calc(100% - 32px));margin:32px auto}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:13px}.logo{display:grid;place-items:center;width:45px;height:45px;border-radius:15px;color:#fff;background:linear-gradient(145deg,var(--brand),#7139c6);font-weight:800;box-shadow:0 10px 24px rgba(49,87,213,.25)}h1{font-size:22px;line-height:1.2;margin:0}.subtitle{color:var(--muted);margin-top:3px}.health{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:#a9b0bd}.dot.ok{background:var(--ok);box-shadow:0 0 0 4px rgba(23,133,87,.12)}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}.panel{background:rgba(255,255,255,.94);border:1px solid rgba(220,226,234,.9);border-radius:20px;box-shadow:var(--shadow)}.chat{min-height:620px;display:flex;flex-direction:column;overflow:hidden}.messages{padding:25px;flex:1;overflow:auto;max-height:600px}.empty{display:grid;place-items:center;text-align:center;min-height:350px;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:19px;margin-bottom:6px}.message{margin-bottom:22px}.label{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--muted);margin-bottom:6px;text-transform:uppercase}.bubble{white-space:pre-wrap;border-radius:15px;padding:13px 16px;background:#f0f3f8}.message.user .bubble{color:#fff;background:linear-gradient(145deg,var(--brand),var(--brand2));margin-left:12%}.message.assistant .bubble{border:1px solid var(--line);background:#fff;margin-right:5%}.cursor::after{content:"";display:inline-block;width:7px;height:17px;margin-left:3px;vertical-align:-3px;background:var(--brand);animation:blink .8s infinite}@keyframes blink{50%{opacity:0}}
    .composer{border-top:1px solid var(--line);padding:17px;background:#fff}.inputrow{display:flex;gap:10px}textarea{width:100%;min-height:78px;max-height:170px;resize:vertical;border:1px solid #cbd3df;border-radius:13px;padding:12px 13px;color:var(--ink);background:#fbfcfe;font:inherit;outline:none}textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(49,87,213,.11)}button,select{font:inherit}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}.options{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}select{border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:#fff}.buttons{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:8px 15px;cursor:pointer;font-weight:700}.send{color:#fff;background:var(--brand)}.stop{color:var(--bad);background:#fff0f1}.btn:disabled{opacity:.45;cursor:not-allowed}
    aside{padding:20px;height:max-content}.side-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.side-title h2{font-size:16px;margin:0}.state{font-size:12px;color:var(--muted)}.state.working{color:var(--brand)}.state.done{color:var(--ok)}.state.error{color:var(--bad)}.source-empty{color:var(--muted);font-size:13px;padding:30px 5px;text-align:center}.source{border:1px solid var(--line);border-radius:13px;padding:12px;margin-top:10px;background:#fbfcff}.source-head{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:750}.score{color:var(--brand)}.source-meta{font-size:12px;color:var(--muted);margin:3px 0 7px}.source-text{font-size:12px;color:#4a5568;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}.timing{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:12px}.errorbox{color:var(--bad);background:#fff0f1;border:1px solid #ffd4d8;border-radius:10px;padding:9px 11px;margin-top:10px;font-size:13px}
    @media(max-width:820px){.shell{margin:18px auto}.top{align-items:flex-start}.layout{grid-template-columns:1fr}.chat{min-height:540px}.messages{max-height:none}.message.user .bubble{margin-left:5%}aside{order:2}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand"><div class="logo">R</div><div><h1>RAGReactor</h1><div class="subtitle">C++ 本地知识库智能问答</div></div></div>
      <div class="health"><span id="healthDot" class="dot"></span><span id="healthText">检查服务中</span></div>
    </header>
    <div class="layout">
      <section class="panel chat" aria-label="问答区域">
        <div id="messages" class="messages">
          <div id="empty" class="empty"><div><strong>向本地知识库提问</strong>答案将基于检索文档生成，并显示引用来源。<br>例如：pipefd 和 EPOLLIN 是什么关系？</div></div>
        </div>
        <div class="composer">
          <div class="inputrow"><textarea id="question" maxlength="4096" placeholder="输入问题，Ctrl/⌘ + Enter 发送" aria-label="问题"></textarea></div>
          <div class="actions">
            <label class="options">检索数量 <select id="topK"><option>1</option><option selected>3</option><option>5</option><option>8</option></select></label>
            <div class="buttons"><button id="stop" class="btn stop" disabled>停止</button><button id="send" class="btn send">发送</button></div>
          </div>
          <div id="requestError" role="alert"></div>
        </div>
      </section>
      <aside class="panel">
        <div class="side-title"><h2>检索来源</h2><span id="state" class="state">等待提问</span></div>
        <div id="sources"><div class="source-empty">提问后将在这里显示文档片段</div></div>
        <div id="timing" class="timing" hidden></div>
      </aside>
    </div>
  </main>
  <script>
    const $=id=>document.getElementById(id), ui={messages:$('messages'),empty:$('empty'),question:$('question'),topK:$('topK'),send:$('send'),stop:$('stop'),state:$('state'),sources:$('sources'),timing:$('timing'),error:$('requestError')};
    let controller=null;
    function getCookie(name){for(const part of document.cookie.split(';')){const item=part.trim();if(item.startsWith(name+'='))return decodeURIComponent(item.slice(name.length+1))}return''}
    function setState(text,kind=''){ui.state.textContent=text;ui.state.className='state '+kind}
    function addMessage(role,text=''){ui.empty?.remove();const wrap=document.createElement('div');wrap.className='message '+role;const label=document.createElement('div');label.className='label';label.textContent=role==='user'?'你':'知识库助手';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;wrap.append(label,bubble);ui.messages.append(wrap);ui.messages.scrollTop=ui.messages.scrollHeight;return bubble}
    function showError(message){ui.error.innerHTML='';if(!message)return;const box=document.createElement('div');box.className='errorbox';box.textContent=message;ui.error.append(box)}
    function renderSources(documents){ui.sources.innerHTML='';if(!documents?.length){ui.sources.innerHTML='<div class="source-empty">没有达到相关度阈值的文档</div>';return}documents.forEach(doc=>{const item=document.createElement('article');item.className='source';const head=document.createElement('div');head.className='source-head';const file=document.createElement('span');file.textContent=doc.file;const score=document.createElement('span');score.className='score';score.textContent=Number(doc.score).toFixed(3);head.append(file,score);const meta=document.createElement('div');meta.className='source-meta';meta.textContent=`片段 ${doc.chunk_index} · 来源 ${doc.id}`;const text=document.createElement('div');text.className='source-text';text.textContent=doc.text;item.append(head,meta,text);ui.sources.append(item)})}
    function parseEvent(block){let event='message',data='';for(const line of block.split(/\r?\n/)){if(line.startsWith('event:'))event=line.slice(6).trim();else if(line.startsWith('data:'))data+=(data?'\n':'')+line.slice(5).trimStart()}if(!data)return null;try{return{event,data:JSON.parse(data)}}catch{return null}}
    async function ask(){const question=ui.question.value.trim();if(!question){showError('请先输入问题。');ui.question.focus();return}showError('');controller=new AbortController();ui.send.disabled=true;ui.stop.disabled=false;ui.question.disabled=true;ui.sources.innerHTML='<div class="source-empty">正在检索知识库…</div>';ui.timing.hidden=true;setState('正在检索','working');addMessage('user',question);const answer=addMessage('assistant');answer.classList.add('cursor');const started=performance.now();let buffer='',receivedDelta=false;
      try{const response=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json','Accept':'text/event-stream','X-CSRF-Token':getCookie('csrf_token')},body:JSON.stringify({question,top_k:Number(ui.topK.value),stream:true}),signal:controller.signal});if(!response.ok){let detail=response.status===401?'登录状态已失效，请重新登录。':`服务器返回 HTTP ${response.status}`;try{const body=await response.json();detail=body.error?.message||detail}catch{}throw new Error(detail)}if(!response.body)throw new Error('浏览器不支持流式响应');const reader=response.body.getReader(),decoder=new TextDecoder();
        for(;;){const{value,done}=await reader.read();buffer+=decoder.decode(value||new Uint8Array(),{stream:!done});let boundary;while((boundary=buffer.indexOf('\n\n'))>=0){const parsed=parseEvent(buffer.slice(0,boundary));buffer=buffer.slice(boundary+2);if(!parsed)continue;if(parsed.event==='sources'){renderSources(parsed.data.documents);setState('正在生成','working')}else if(parsed.event==='delta'){if(!receivedDelta){answer.textContent='';receivedDelta=true}answer.textContent+=parsed.data.text||'';ui.messages.scrollTop=ui.messages.scrollHeight}else if(parsed.event==='error'){throw new Error(parsed.data.message||'模型流式请求失败')}else if(parsed.event==='done'){setState('已完成','done');answer.classList.remove('cursor');ui.timing.hidden=false;ui.timing.textContent=`首 Token：${parsed.data.ttft_ms ?? '-'} ms · 总生成：${parsed.data.total_ms ?? '-'} ms`}}if(done)break}
        if(!receivedDelta)answer.textContent='未收到回答内容。';answer.classList.remove('cursor');if(ui.state.textContent!=='已完成')setState('已结束','done');ui.question.value='';
      }catch(error){answer.classList.remove('cursor');if(error.name==='AbortError'){if(!receivedDelta)answer.textContent='回答已停止。';setState('已停止')}else{answer.textContent=receivedDelta?answer.textContent:'请求失败。';showError(error.message);setState('请求失败','error')}}finally{controller=null;ui.send.disabled=false;ui.stop.disabled=true;ui.question.disabled=false;ui.question.focus()}}
    ui.send.addEventListener('click',ask);ui.stop.addEventListener('click',()=>controller?.abort());ui.question.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter')ask()});
    fetch('/api/health').then(r=>r.json()).then(data=>{if(data.status==='ok'&&data.rag_configured){$('healthDot').classList.add('ok');$('healthText').textContent=data.index_ready?'服务与索引正常':'服务正常，索引待构建'}else throw 0}).catch(()=>{$('healthText').textContent='服务不可用'});
  </script>
</body>
</html>
